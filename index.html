        function calculateSoloScore(scores, tp) {
            if (!scores || Object.keys(scores).length === 0) return null;
            const iktpList = tp.iktps || [];
            if (iktpList.length === 0) return null;

            let totalSolo = 0;
            let assessedCount = 0;

            iktpList.forEach(ik => {
                if (scores[ik.id]) {
                    totalSolo += Number(scores[ik.id]);
                    assessedCount++;
                }
            });

            if (assessedCount < iktpList.length) {
                return { isComplete: false, assessedCount, totalCount: iktpList.length };
            }

            const avgSolo = +(totalSolo / iktpList.length).toFixed(2);
            
            let levelBase = "Prestructural";
            let skorBase = 1;
            let minVal = 0;
            let interval = 10;

            const ranges = tp.ranges || {
                Prestructural: { min: 0, max: 59 },
                Unistructural: { min: 60, max: 74 },
                Multistructural: { min: 75, max: 83 },
                Relational: { min: 84, max: 92 },
                ExtendedAbstract: { min: 93, max: 100 }
            };

            if (avgSolo >= 4.51) {
                levelBase = "ExtendedAbstract"; skorBase = 5; minVal = ranges.ExtendedAbstract.min; interval = ranges.ExtendedAbstract.max - ranges.ExtendedAbstract.min;
            } else if (avgSolo >= 3.5) {
                levelBase = "Relational"; skorBase = 4; minVal = ranges.Relational.min; interval = ranges.Relational.max - ranges.Relational.min;
            } else if (avgSolo >= 2.5) {
                levelBase = "Multistructural"; skorBase = 3; minVal = ranges.Multistructural.min; interval = ranges.Multistructural.max - ranges.Multistructural.min;
            } else if (avgSolo >= 1.5) {
                levelBase = "Unistructural"; skorBase = 2; minVal = ranges.Unistructural.min; interval = ranges.Unistructural.max - ranges.Unistructural.min;
            } else {
                levelBase = "Prestructural"; skorBase = 1; minVal = ranges.Prestructural.min; interval = ranges.Prestructural.max - ranges.Prestructural.min;
            }

            let numericScore = minVal + (avgSolo - skorBase) * interval;
            numericScore = +Math.min(100, Math.max(0, numericScore)).toFixed(2);

            const levelWeights = { Prestructural: 1, Unistructural: 2, Multistructural: 3, Relational: 4, ExtendedAbstract: 5 };
            const kktpTarget = tp.kktpLevel || "Multistructural";
            const isPassing = levelWeights[levelBase] >= levelWeights[kktpTarget];

            return { isComplete: true, avgSolo, levelBase, numericScore, isPassing, kktpTarget };
        }

        // --- STUDENTS VIEW (SUPABASE + EXCEL IMPORT) ---
        function StudentsView({ students, classes, showToast, refreshData }) {
            const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || "");
            const [name, setName] = useState("");
            const [nis, setNis] = useState("");
            const [nisn, setNisn] = useState("");
            const [gender, setGender] = useState("L");

            const [isImportModalOpen, setIsImportModalOpen] = useState(false);
            const [importTargetClassId, setImportTargetClassId] = useState(classes[0]?.id || "");
            const [validationResult, setValidationResult] = useState({ valid: [], invalid: [] });

            useEffect(() => {
                if (classes.length > 0 && !selectedClassId) setSelectedClassId(classes[0].id);
                if (classes.length > 0 && !importTargetClassId) setImportTargetClassId(classes[0].id);
            }, [classes]);

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!name || !nis) return alert("Nama dan NIS wajib diisi!");

                if (supabase) {
                    const { error } = await supabase.from('students').insert([{ class_id: selectedClassId, name, nis, nisn, gender }]);
                    if (error) { alert("Gagal menyimpan: " + error.message); return; }
                    refreshData();
                }

                setName(""); setNis(""); setNisn("");
                showToast("Murid berhasil ditambahkan!");
            };

            const handleDelete = async (id) => {
                if (!confirm("Hapus data murid ini?")) return;
                if (supabase) {
                    const { error } = await supabase.from('students').delete().eq('id', id);
                    if (error) { alert("Gagal menghapus: " + error.message); return; }
                    refreshData();
                }
                showToast("Murid dihapus.", "error");
            };

            const downloadTemplate = () => {
                const templateData = [
                    ["No", "Nama Lengkap", "NIS", "NISN", "Jenis Kelamin", "Kelas", "Tempat Lahir", "Tanggal Lahir", "Alamat"],
                    [1, "Andi Ahmad Rivaldi", "24001", "0081234561", "L", classes[0]?.name || "VII A", "Sungguminasa", "2011-05-12", "Jl. Tumanurung No. 5"]
                ];
                const ws = XLSX.utils.aoa_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template_Murid");
                XLSX.writeFile(wb, "Template_Import_Murid_SIPAKATAU.xlsx");
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        if (data.length <= 1) { alert("File Excel kosong!"); return; }

                        const rows = data.slice(1);
                        const validList = [];
                        const invalidList = [];

                        rows.forEach((row, idx) => {
                            if (!row || row.length === 0 || row.every(c => c === null || String(c).trim() === "")) return;
                            const rowName = row[1] ? String(row[1]).trim() : "";
                            const rowNis = row[2] ? String(row[2]).trim() : "";
                            const rowNisn = row[3] ? String(row[3]).trim() : "";
                            const rowGender = row[4] ? String(row[4]).trim().toUpperCase() : "L";

                            const errors = [];
                            if (!rowName) errors.push("Nama kosong");
                            if (!rowNis) errors.push("NIS kosong");

                            if (errors.length > 0) {
                                invalidList.push({ rowNo: idx + 2, name: rowName || '-', nis: rowNis || '-', errors });
                            } else {
                                validList.push({
                                    class_id: importTargetClassId,
                                    name: rowName,
                                    nis: rowNis,
                                    nisn: rowNisn,
                                    gender: (rowGender === 'P' || rowGender === 'PEREMPUAN') ? 'P' : 'L'
                                });
                            }
                        });

                        setValidationResult({ valid: validList, invalid: invalidList });
                    } catch (err) {
                        alert("Gagal membaca file Excel.");
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleCommitImport = async () => {
                if (validationResult.valid.length === 0) return;

                if (supabase) {
                    const { error } = await supabase.from('students').insert(validationResult.valid);
                    if (error) { alert("Gagal import ke database: " + error.message); return; }
                    refreshData();
                }

                showToast(`Berhasil mengimpor ${validationResult.valid.length} data murid!`);
                setIsImportModalOpen(false);
                setValidationResult({ valid: [], invalid: [] });
            };

            const filtered = students.filter(s => (s.class_id || s.classId) === selectedClassId);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div className="flex items-center gap-3">
                            <label className="text-xs font-bold text-slate-600">Pilih Kelas:</label>
                            <select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="px-3 py-2 border rounded-xl text-sm font-semibold outline-none">
                                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={downloadTemplate} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-3.5 py-2 rounded-xl transition-all flex items-center gap-1.5">
                                <i className="fa-solid fa-download text-brand-600"></i> Download Template Excel
                            </button>
                            <button onClick={() => { setIsImportModalOpen(true); setImportTargetClassId(selectedClassId); }} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-md transition-all flex items-center gap-1.5">
                                <i className="fa-solid fa-file-excel"></i> Import Excel
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 className="text-base font-bold text-slate-800 border-b pb-3">+ Tambah Murid Manual</h3>
                            <form onSubmit={handleAdd} className="space-y-3">
                                <input type="text" placeholder="Nama Lengkap" value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs outline-none" required />
                                <input type="text" placeholder="NIS" value={nis} onChange={e => setNis(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs outline-none" required />
                                <input type="text" placeholder="NISN (Opsional)" value={nisn} onChange={e => setNisn(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs outline-none" />
                                <select value={gender} onChange={e => setGender(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs outline-none">
                                    <option value="L">Laki-laki</option><option value="P">Perempuan</option>
                                </select>
                                <button type="submit" className="w-full bg-brand-600 text-white font-bold text-xs py-2.5 rounded-xl shadow-md">Simpan Murid</button>
                            </form>
                        </div>

                        <div className="md:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 className="text-base font-bold text-slate-800 border-b pb-3">Daftar Murid ({filtered.length})</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-slate-100 text-slate-700 font-bold">
                                        <tr><th className="p-3">No</th><th className="p-3">Nama Lengkap</th><th className="p-3">NIS</th><th className="p-3">L/P</th><th className="p-3 text-right">Aksi</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filtered.length === 0 ? (
                                            <tr><td colSpan="5" className="p-4 text-center text-slate-400 italic">Belum ada murid di kelas ini.</td></tr>
                                        ) : (
                                            filtered.map((st, i) => (
                                                <tr key={st.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-semibold">{i + 1}</td>
                                                    <td className="p-3 font-bold text-slate-800">{st.name}</td>
                                                    <td className="p-3 font-mono">{st.nis}</td>
                                                    <td className="p-3">{st.gender}</td>
                                                    <td className="p-3 text-right">
                                                        <button onClick={() => handleDelete(st.id)} className="text-rose-600"><i className="fa-solid fa-trash"></i></button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {isImportModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-lg w-full space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-base font-bold">Import Excel ke Database</h3>
                                    <button onClick={() => setIsImportModalOpen(false)}><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="font-semibold block mb-1">Pilih Kelas Tujuan:</label>
                                        <select value={importTargetClassId} onChange={e => setImportTargetClassId(e.target.value)} className="w-full p-2 border rounded-xl">
                                            {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="font-semibold block mb-1">File Excel (.xlsx):</label>
                                        <input type="file" accept=".xlsx" onChange={handleFileUpload} className="w-full text-slate-500" />
                                    </div>
                                    {validationResult.valid.length > 0 && (
                                        <p className="text-emerald-700 font-bold">✓ {validationResult.valid.length} data valid siap diimpor.</p>
                                    )}
                                </div>
                                <div className="flex justify-end gap-2 pt-3 border-t">
                                    <button onClick={() => setIsImportModalOpen(false)} className="px-4 py-2 border rounded-xl text-xs">Batal</button>
                                    <button onClick={handleCommitImport} disabled={validationResult.valid.length === 0} className="px-5 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-md disabled:bg-slate-300">Simpan Data</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

                if (classes.length > 0 && !selectedClassId) setSelectedClassId(classes[0].id);
            }, [classes]);

            const currentStudents = students.filter(s => (s.class_id || s.classId) === selectedClassId);

            const handleStatusChange = (studentId, status) => {
                setRecords(prev => ({ ...prev, [studentId]: status }));
            };

            const markAllHadir = () => {
                const updated = {};
                currentStudents.forEach(s => { updated[s.id] = "Hadir"; });
                setRecords(updated);
            };

            const handleSaveAttendance = async (e) => {
                e.preventDefault();
                if (supabase) {
                    const { error } = await supabase.from('attendance_sessions').insert([{
                        class_id: selectedClassId,
                        session_date: sessionDate,
                        session_no: Number(sessionNo),
                        material,
                        records
                    }]);
                    if (error) { alert("Gagal menyimpan: " + error.message); return; }
                    refreshData();
                }
                showToast("Data kehadiran berhasil disimpan ke Cloud!");
                setRecords({}); setMaterial("");
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <h3 className="text-base font-bold text-slate-800 border-b pb-3 flex items-center justify-between">
                            <span>Input Kehadiran Per Pertemuan</span>
                            <button onClick={markAllHadir} type="button" className="text-xs bg-emerald-50 text-emerald-700 border font-bold px-3 py-1.5 rounded-lg">✓ Tandai Semua Hadir</button>
                        </h3>

                        <form onSubmit={handleSaveAttendance} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div><label className="block text-xs font-semibold mb-1">Kelas</label><select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs">{classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                                <div><label className="block text-xs font-semibold mb-1">Tanggal Pertemuan</label><input type="date" value={sessionDate} onChange={e => setSessionDate(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" required /></div>
                                <div><label className="block text-xs font-semibold mb-1">Pertemuan Ke-</label><input type="number" min="1" value={sessionNo} onChange={e => setSessionNo(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" required /></div>
                                <div className="md:col-span-3"><label className="block text-xs font-semibold mb-1">Materi Pembelajaran (Opsional)</label><input type="text" value={material} onChange={e => setMaterial(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" /></div>
                            </div>

                            <div className="border rounded-xl overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-slate-100 font-bold">
                                        <tr><th className="p-3">No</th><th className="p-3">Nama Murid</th><th className="p-3 text-center">Status Kehadiran</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {currentStudents.map((st, i) => {
                                            const currentStatus = records[st.id] || "Hadir";
                                            return (
                                                <tr key={st.id}>
                                                    <td className="p-3 font-semibold">{i + 1}</td>
                                                    <td className="p-3 font-bold">{st.name}</td>
                                                    <td className="p-3 text-center">
                                                        <div className="flex justify-center gap-1.5">
                                                            {["Hadir", "Izin", "Sakit", "Alpa", "Terlambat"].map(stt => (
                                                                <button type="button" key={stt} onClick={() => handleStatusChange(st.id, stt)} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${currentStatus === stt ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600'}`}>{stt}</button>
                                                            ))}
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            <div className="flex justify-end"><button type="submit" className="bg-brand-600 text-white font-bold text-xs px-6 py-2.5 rounded-xl">Simpan Kehadiran</button></div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- CURRICULUM VIEW (ORIGINAL FULL INTERACTIVE CRUD & SOLO RUBRIC) ---
        function CurriculumView({ curriculum, setCurriculum, showToast }) {
            const [expandedCp, setExpandedCp] = useState({});
            const [expandedMat, setExpandedMat] = useState({});
            const [activeModal, setActiveModal] = useState(null);
            const [modalData, setModalData] = useState({});

            const toggleCp = id => setExpandedCp(prev => ({ ...prev, [id]: !prev[id] }));
            const toggleMat = id => setExpandedMat(prev => ({ ...prev, [id]: !prev[id] }));

            const handleSaveCp = (e) => {
                e.preventDefault();
                if (modalData.id) {
                    setCurriculum(prev => prev.map(c => c.id === modalData.id ? { ...c, ...modalData } : c));
                    showToast("Capaian Pembelajaran diperbarui!");
                } else {
                    const newCp = { id: 'cp_' + Date.now(), subject: modalData.subject || "IPA", phase: modalData.phase || "D", element: modalData.element || "Pemahaman", description: modalData.description || "", materials: [] };
                    setCurriculum(prev => [...prev, newCp]);
                    showToast("CP baru ditambahkan!");
                }
                setActiveModal(null);
            };

            const handleDeleteCp = (cpId) => {
                if (confirm("Hapus CP ini beserta seluruh materinya?")) {
                    setCurriculum(prev => prev.filter(c => c.id !== cpId));
                    showToast("CP dihapus.", "error");
                }
            };

            const handleSaveMaterial = (e) => {
                e.preventDefault();
                const { cpId, id, title } = modalData;
                setCurriculum(prev => prev.map(cp => {
                    if (cp.id !== cpId) return cp;
                    let updatedMats = [...cp.materials];
                    if (id) updatedMats = updatedMats.map(m => m.id === id ? { ...m, title } : m);
                    else updatedMats.push({ id: 'm_' + Date.now(), title, tps: [] });
                    return { ...cp, materials: updatedMats };
                }));
                showToast("Materi disimpan!");
                setActiveModal(null);
            };

            const handleDeleteMaterial = (cpId, matId) => {
                if (confirm("Hapus materi ini?")) {
                    setCurriculum(prev => prev.map(cp => {
                        if (cp.id !== cpId) return cp;
                        return { ...cp, materials: cp.materials.filter(m => m.id !== matId) };
                    }));
                    showToast("Materi dihapus.", "error");
                }
            };

            const handleSaveTp = (e) => {
                e.preventDefault();
                const { cpId, matId, id, code, description } = modalData;
                setCurriculum(prev => prev.map(cp => {
                    if (cp.id !== cpId) return cp;
                    const updatedMats = cp.materials.map(m => {
                        if (m.id !== matId) return m;
                        let updatedTps = [...m.tps];
                        if (id) updatedTps = updatedTps.map(t => t.id === id ? { ...t, code, description } : t);
                        else updatedTps.push({
                            id: 'tp_' + Date.now(),
                            code: code || `TP ${updatedTps.length + 1}`,
                            description,
                            kktpLevel: "Multistructural",
                            ranges: { Prestructural: { min: 0, max: 59 }, Unistructural: { min: 60, max: 74 }, Multistructural: { min: 75, max: 83 }, Relational: { min: 84, max: 92 }, ExtendedAbstract: { min: 93, max: 100 } },
                            iktps: []
                        });
                        return { ...m, tps: updatedTps };
                    });
                    return { ...cp, materials: updatedMats };
                }));
                showToast("TP disimpan!");
                setActiveModal(null);
            };

            const handleDeleteTp = (cpId, matId, tpId) => {
                if (confirm("Hapus TP ini?")) {
                    setCurriculum(prev => prev.map(cp => {
                        if (cp.id !== cpId) return cp;
                        const updatedMats = cp.materials.map(m => {
                            if (m.id !== matId) return m;
                            return { ...m, tps: m.tps.filter(t => t.id !== tpId) };
                        });
                        return { ...cp, materials: updatedMats };
                    }));
                    showToast("TP dihapus.", "error");
                }
            };

            const handleSaveIktp = (e) => {
                e.preventDefault();
                const { cpId, matId, tpId, id, description, rubric } = modalData;
                setCurriculum(prev => prev.map(cp => {
                    if (cp.id !== cpId) return cp;
                    const updatedMats = cp.materials.map(m => {
                        if (m.id !== matId) return m;
                        const updatedTps = m.tps.map(t => {
                            if (t.id !== tpId) return t;
                            let updatedIktps = [...t.iktps];
                            if (id) updatedIktps = updatedIktps.map(ik => ik.id === id ? { ...ik, description, rubric } : ik);
                            else updatedIktps.push({
                                id: 'ik_' + Date.now(),
                                description,
                                rubric: rubric || { Prestructural: "Belum paham", Unistructural: "Paham 1 aspek", Multistructural: "Paham banyak", Relational: "Menghubungkan", ExtendedAbstract: "Abstraksi" }
                            });
                            return { ...t, iktps: updatedIktps };
                        });
                        return { ...m, tps: updatedTps };
                    });
                    return { ...cp, materials: updatedMats };
                }));
                showToast("IKTP & Rubrik SOLO disimpan!");
                setActiveModal(null);
            };

            const handleDeleteIktp = (cpId, matId, tpId, iktpId) => {
                if (confirm("Hapus IKTP ini?")) {
                    setCurriculum(prev => prev.map(cp => {
                        if (cp.id !== cpId) return cp;
                        const updatedMats = cp.materials.map(m => {
                            if (m.id !== matId) return m;
                            const updatedTps = m.tps.map(t => {
                                if (t.id !== tpId) return t;
                                return { ...t, iktps: t.iktps.filter(ik => ik.id !== iktpId) };
                            });
                            return { ...m, tps: updatedTps };
                        });
                        return { ...cp, materials: updatedMats };
                    }));
                    showToast("IKTP dihapus.", "error");
                }
            };

            const handleGenerateIktpAi = (cpId, matId, tp) => {
                const generatedDescription = `Murid mampu menganalisis implikasi lanjutan dari ${tp.description.toLowerCase().replace('murid mampu ', '')}.`;
                const generatedRubric = {
                    Prestructural: `Murid belum mampu menunjukkan pemahaman mengenai ${tp.code}.`,
                    Unistructural: `Murid dapat mengidentifikasi satu komponen dasar pada ${tp.code}.`,
                    Multistructural: `Murid dapat mendaftarkan beberapa komponen utama pada ${tp.code}.`,
                    Relational: `Murid dapat menghubungkan antar komponen pada ${tp.code} secara terintegrasi.`,
                    ExtendedAbstract: `Murid dapat mengevaluasi dan menggeneralisasi konsep ${tp.code}.`
                };
                setModalData({ cpId, matId, tpId: tp.id, description: generatedDescription, rubric: generatedRubric });
                setActiveModal('iktp');
                showToast("IKTP & Rubrik SOLO dihasilkan via AI Gemini!");
            };

            const handleSaveKktp = (e) => {
                e.preventDefault();
                const { cpId, matId, tpId, kktpLevel, ranges } = modalData;
                setCurriculum(prev => prev.map(cp => {
                    if (cp.id !== cpId) return cp;
                    const updatedMats = cp.materials.map(m => {
                        if (m.id !== matId) return m;
                        const updatedTps = m.tps.map(t => {
                            if (t.id !== tpId) return t;
                            return { ...t, kktpLevel, ranges };
                        });
                        return { ...m, tps: updatedTps };
                    });
                    return { ...cp, materials: updatedMats };
                }));
                showToast("KKTP diperbarui!");
                setActiveModal(null);
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border shadow-sm flex justify-between items-center">
                        <div><h3 className="text-base font-bold">Struktur Kurikulum Bertingkat & Rubrik SOLO</h3><p className="text-xs text-slate-500">Kelola CP, Materi, TP, IKTP, Rubrik SOLO, dan KKTP secara mandiri.</p></div>
                        <button onClick={() => { setModalData({}); setActiveModal('cp'); }} className="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md">+ Tambah CP Baru</button>
                    </div>

                    <div className="space-y-4">
                        {curriculum.map(cp => (
                            <div key={cp.id} className="bg-white border rounded-2xl overflow-hidden shadow-xs">
                                <div className="p-4 bg-slate-900 text-white flex justify-between items-center cursor-pointer" onClick={() => toggleCp(cp.id)}>
                                    <div className="flex items-center gap-3">
                                        <i className={`fa-solid ${expandedCp[cp.id] ? 'fa-chevron-down' : 'fa-chevron-right'} text-brand-300 text-xs`}></i>
                                        <div><span className="bg-brand-500/30 text-brand-200 text-[10px] font-bold px-2 py-0.5 rounded mr-2">Fase {cp.phase}</span><span className="font-bold text-sm">{cp.subject}</span><p className="text-xs text-slate-300 mt-0.5">{cp.description}</p></div>
                                    </div>
                                    <div className="flex items-center gap-2" onClick={e => e.stopPropagation()}>
                                        <button onClick={() => { setModalData({ cpId: cp.id }); setActiveModal('material'); }} className="bg-brand-600 hover:bg-brand-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg">+ Materi</button>
                                        <button onClick={() => { setModalData(cp); setActiveModal('cp'); }} className="text-slate-300 p-1.5"><i className="fa-solid fa-pen text-xs"></i></button>
                                        <button onClick={() => handleDeleteCp(cp.id)} className="text-rose-400 p-1.5"><i className="fa-solid fa-trash text-xs"></i></button>
                                    </div>
                                </div>
                                {expandedCp[cp.id] && (
                                    <div className="p-4 bg-slate-50 space-y-4">
                                        {cp.materials.map(mat => (
                                            <div key={mat.id} className="bg-white border rounded-xl overflow-hidden shadow-xs">
                                                <div className="p-3 bg-slate-100 flex justify-between items-center cursor-pointer" onClick={() => toggleMat(mat.id)}>
                                                    <span className="font-bold text-xs text-slate-800">Materi: {mat.title}</span>
                                                    <div className="flex items-center gap-2" onClick={e => e.stopPropagation()}>
                                                        <button onClick={() => { setModalData({ cpId: cp.id, matId: mat.id }); setActiveModal('tp'); }} className="bg-slate-800 text-white text-[10px] font-bold px-2.5 py-1 rounded">+ TP</button>
                                                        <button onClick={() => { setModalData({ cpId: cp.id, id: mat.id, title: mat.title }); setActiveModal('material'); }} className="text-slate-500 p-1"><i className="fa-solid fa-pen text-xs"></i></button>
                                                        <button onClick={() => handleDeleteMaterial(cp.id, mat.id)} className="text-rose-600 p-1"><i className="fa-solid fa-trash text-xs"></i></button>
                                                    </div>
                                                </div>
                                                {expandedMat[mat.id] && (
                                                    <div className="p-3 space-y-3">
                                                        {mat.tps.map(tp => (
                                                            <div key={tp.id} className="border border-brand-100 rounded-xl p-3 bg-brand-50/30 space-y-3">
                                                                <div className="flex justify-between items-start gap-2">
                                                                    <div>
                                                                        <div className="flex items-center gap-2">
                                                                            <span className="font-bold text-xs text-brand-700">{tp.code}</span>
                                                                            <span className="bg-purple-100 text-purple-700 font-bold text-[10px] px-2 py-0.5 rounded-full">KKTP: {tp.kktpLevel || "Multistructural"}</span>
                                                                        </div>
                                                                        <p className="text-xs text-slate-700 font-medium mt-1">{tp.description}</p>
                                                                    </div>
                                                                    <div className="flex items-center gap-1">
                                                                        <button onClick={() => handleGenerateIktpAi(cp.id, mat.id, tp)} className="bg-purple-600 text-white font-bold text-[10px] px-2 py-1 rounded flex items-center gap-1"><i className="fa-solid fa-wand-magic-sparkles"></i> AI IKTP</button>
                                                                        <button onClick={() => { setModalData({ cpId: cp.id, matId: mat.id, tpId: tp.id }); setActiveModal('iktp'); }} className="bg-slate-200 text-slate-700 font-bold text-[10px] px-2 py-1 rounded">+ IKTP</button>
                                                                        <button onClick={() => { setModalData({ cpId: cp.id, matId: mat.id, tpId: tp.id, kktpLevel: tp.kktpLevel, ranges: tp.ranges }); setActiveModal('kktp'); }} className="bg-amber-100 text-amber-800 font-bold text-[10px] px-2 py-1 rounded">Set KKTP</button>
                                                                        <button onClick={() => { setModalData({ cpId: cp.id, matId: mat.id, ...tp }); setActiveModal('tp'); }} className="text-slate-500 p-1"><i className="fa-solid fa-pen text-xs"></i></button>
                                                                        <button onClick={() => handleDeleteTp(cp.id, mat.id, tp.id)} className="text-rose-600 p-1"><i className="fa-solid fa-trash text-xs"></i></button>
                                                                    </div>
                                                                </div>
                                                                <div className="space-y-2 pt-2 border-t border-brand-100">
                                                                    {tp.iktps.map((ik, ikIdx) => (
                                                                        <div key={ik.id} className="bg-white p-3 rounded-lg border text-xs space-y-2">
                                                                            <div className="flex justify-between items-center">
                                                                                <span className="font-bold text-slate-800">IKTP {ikIdx + 1}: {ik.description}</span>
                                                                                <div className="flex items-center gap-1">
                                                                                    <button onClick={() => { setModalData({ cpId: cp.id, matId: mat.id, tpId: tp.id, ...ik }); setActiveModal('iktp'); }} className="text-brand-600 font-bold text-[10px] hover:underline">Edit Rubrik</button>
                                                                                    <button onClick={() => handleDeleteIktp(cp.id, mat.id, tp.id, ik.id)} className="text-rose-600 p-1"><i className="fa-solid fa-trash"></i></button>
                                                                                </div>
                                                                            </div>
                                                                            <div className="grid grid-cols-1 md:grid-cols-5 gap-1.5 text-[10px]">
                                                                                <div className="p-2 bg-rose-50 border rounded"><span className="font-bold text-rose-800 block">1. Prestructural</span><p className="text-slate-600">{ik.rubric?.Prestructural || '-'}</p></div>
                                                                                <div className="p-2 bg-amber-50 border rounded"><span className="font-bold text-amber-800 block">2. Unistructural</span><p className="text-slate-600">{ik.rubric?.Unistructural || '-'}</p></div>
                                                                                <div className="p-2 bg-blue-50 border rounded"><span className="font-bold text-blue-800 block">3. Multistructural</span><p className="text-slate-600">{ik.rubric?.Multistructural || '-'}</p></div>
                                                                                <div className="p-2 bg-indigo-50 border rounded"><span className="font-bold text-indigo-800 block">4. Relational</span><p className="text-slate-600">{ik.rubric?.Relational || '-'}</p></div>
                                                                                <div className="p-2 bg-emerald-50 border rounded"><span className="font-bold text-emerald-800 block">5. Extended Abstract</span><p className="text-slate-600">{ik.rubric?.ExtendedAbstract || '-'}</p></div>
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {/* MODAL CP */}
                    {activeModal === 'cp' && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-lg w-full space-y-4">
                                <h3 className="text-base font-bold border-b pb-3">Form Capaian Pembelajaran (CP)</h3>
                                <form onSubmit={handleSaveCp} className="space-y-3 text-xs">
                                    <div><label className="font-semibold block mb-1">Mata Pelajaran</label><input type="text" value={modalData.subject || ''} onChange={e => setModalData({...modalData, subject: e.target.value})} className="w-full p-2 border rounded-xl" required /></div>
                                    <div><label className="font-semibold block mb-1">Fase</label><input type="text" value={modalData.phase || 'D'} onChange={e => setModalData({...modalData, phase: e.target.value})} className="w-full p-2 border rounded-xl" required /></div>
                                    <div><label className="font-semibold block mb-1">Deskripsi CP</label><textarea rows="3" value={modalData.description || ''} onChange={e => setModalData({...modalData, description: e.target.value})} className="w-full p-2 border rounded-xl" required /></div>
                                    <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-xl">Batal</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white font-bold rounded-xl shadow-md">Simpan CP</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL MATERIAL */}
                    {activeModal === 'material' && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-base font-bold border-b pb-3">Form Materi Pembelajaran</h3>
                                <form onSubmit={handleSaveMaterial} className="space-y-3 text-xs">
                                    <div><label className="font-semibold block mb-1">Judul Materi</label><input type="text" value={modalData.title || ''} onChange={e => setModalData({...modalData, title: e.target.value})} className="w-full p-2 border rounded-xl" required /></div>
                                    <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-xl">Batal</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white font-bold rounded-xl">Simpan Materi</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL TP */}
                    {activeModal === 'tp' && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="text-base font-bold border-b pb-3">Form Tujuan Pembelajaran (TP)</h3>
                                <form onSubmit={handleSaveTp} className="space-y-3 text-xs">
                                    <div><label className="font-semibold block mb-1">Kode TP (Misal: TP 1)</label><input type="text" value={modalData.code || ''} onChange={e => setModalData({...modalData, code: e.target.value})} className="w-full p-2 border rounded-xl" required /></div>
                                    <div><label className="font-semibold block mb-1">Deskripsi TP</label><textarea rows="3" value={modalData.description || ''} onChange={e => setModalData({...modalData, description: e.target.value})} className="w-full p-2 border rounded-xl" required /></div>
                                    <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-xl">Batal</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white font-bold rounded-xl">Simpan TP</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL IKTP */}
                    {activeModal === 'iktp' && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                            <div className="bg-white p-6 rounded-2xl max-w-3xl w-full space-y-4 my-8">
                                <h3 className="text-base font-bold border-b pb-3">Edit IKTP & Rubrik SOLO</h3>
                                <form onSubmit={handleSaveIktp} className="space-y-4 text-xs">
                                    <div><label className="font-semibold block mb-1">Rumusan IKTP</label><input type="text" value={modalData.description || ''} onChange={e => setModalData({...modalData, description: e.target.value})} className="w-full p-2 border rounded-xl" required /></div>
                                    <div className="space-y-2">
                                        <p className="font-bold">Deskripsi Rubrik SOLO 5 Level:</p>
                                        {["Prestructural", "Unistructural", "Multistructural", "Relational", "ExtendedAbstract"].map((lvl) => (
                                            <div key={lvl} className="p-2 border rounded bg-slate-50"><label className="font-bold block mb-1">{lvl}</label><textarea rows="2" value={modalData.rubric?.[lvl] || ''} onChange={e => setModalData({...modalData, rubric: {...modalData.rubric, [lvl]: e.target.value}})} className="w-full p-2 border rounded" required /></div>
                                        ))}
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-xl">Batal</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white font-bold rounded-xl">Simpan Rubrik</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL KKTP */}
                    {activeModal === 'kktp' && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-2xl max-w-md w-full space-y-4 text-xs">
                                <h3 className="text-base font-bold border-b pb-3">Pengaturan KKTP</h3>
                                <form onSubmit={handleSaveKktp} className="space-y-3">
                                    <div>
                                        <label className="font-semibold block mb-1">Target KKTP:</label>
                                        <select value={modalData.kktpLevel || 'Multistructural'} onChange={e => setModalData({...modalData, kktpLevel: e.target.value})} className="w-full p-2 border rounded-xl font-bold">
                                            <option value="Prestructural">Prestructural</option><option value="Unistructural">Unistructural</option><option value="Multistructural">Multistructural</option><option value="Relational">Relational</option><option value="ExtendedAbstract">Extended Abstract</option>
                                        </select>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2"><button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 border rounded-xl">Batal</button><button type="submit" className="px-5 py-2 bg-brand-600 text-white font-bold rounded-xl">Simpan</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- ASSESSMENT INPUT VIEW (SUPABASE CONNECTED) ---
        function AssessmentInputView({ classes, students, curriculum, assessments, showToast, refreshData }) {
            const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || "");
            const [selectedTpId, setSelectedTpId] = useState("");

            useEffect(() => {
                if (classes.length > 0 && !selectedClassId) setSelectedClassId(classes[0].id);
            }, [classes]);

            const currentStudents = students.filter(s => (s.class_id || s.classId) === selectedClassId);
            const allTps = [];
            curriculum.forEach(cp => cp.materials.forEach(m => m.tps.forEach(tp => allTps.push(tp))));
            const selectedTp = allTps.find(t => t.id === selectedTpId) || allTps[0];

            const currentScores = assessments[`${selectedClassId}_${selectedTp?.id}`] || {};

            const handleScoreSelect = async (studentId, iktpId, levelScore) => {
                const newStudentScores = {
                    ...(currentScores[studentId] || {}),
                    [iktpId]: levelScore
                };

                if (supabase) {
                    const { error } = await supabase.from('assessments').upsert([{
                        class_id: selectedClassId,
                        tp_id: selectedTp.id,
                        student_id: studentId,
                        scores: newStudentScores
                    }], { onConflict: 'class_id,tp_id,student_id' });

                    if (error) console.error("Gagal simpan skor:", error.message);
                    else refreshData();
                }
                showToast("Nilai SOLO tersimpan di Cloud!");
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 className="text-base font-bold">Input Penilaian Rubrik SOLO</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label className="text-xs font-semibold block mb-1">Pilih Kelas</label><select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs">{classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                            <div><label className="text-xs font-semibold block mb-1">Pilih TP</label><select value={selectedTpId || selectedTp?.id} onChange={e => setSelectedTpId(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs">{allTps.map(tp => <option key={tp.id} value={tp.id}>[{tp.code}] {tp.description.slice(0, 40)}...</option>)}</select></div>
                        </div>
                    </div>

                    {selectedTp && (
                        <div className="bg-white p-6 rounded-2xl border shadow-sm overflow-x-auto space-y-4">
                            <h4 className="font-bold text-sm text-slate-800">{selectedTp.code}: {selectedTp.description}</h4>
                            <table className="w-full text-left text-xs border-collapse">
                                <thead className="bg-slate-100 font-bold">
                                    <tr><th className="p-3 border">No</th><th className="p-3 border">Nama Murid</th>{selectedTp.iktps.map((ik, idx) => <th key={ik.id} className="p-3 border">IKTP {idx + 1}</th>)}<th className="p-3 border text-center">Rata-rata</th><th className="p-3 border text-center">Angka</th></tr>
                                </thead>
                                <tbody className="divide-y">
                                    {currentStudents.map((st, i) => {
                                        const studentScores = currentScores[st.id] || {};
                                        const calc = calculateSoloScore(studentScores, selectedTp);
                                        return (
                                            <tr key={st.id}>
                                                <td className="p-3 border font-semibold">{i + 1}</td>
                                                <td className="p-3 border font-bold">{st.name}</td>
                                                {selectedTp.iktps.map(ik => (
                                                    <td key={ik.id} className="p-3 border">
                                                        <select value={studentScores[ik.id] || 0} onChange={e => handleScoreSelect(st.id, ik.id, Number(e.target.value))} className="w-full px-2 py-1 border rounded text-[11px]">
                                                            <option value={0}>-- Pilih --</option>
                                                            <option value={1}>1 - Prestructural</option>
                                                            <option value={2}>2 - Unistructural</option>
                                                            <option value={3}>3 - Multistructural</option>
                                                            <option value={4}>4 - Relational</option>
                                                            <option value={5}>5 - Extended Abstract</option>
                                                        </select>
                                                    </td>
                                                ))}
                                                <td className="p-3 border text-center font-bold text-brand-700">{calc?.isComplete ? calc.avgSolo : '-'}</td>
                                                <td className="p-3 border text-center font-bold">{calc?.isComplete ? calc.numericScore : '-'}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            );
        }

        // --- REPORTS VIEW ---
        function ReportsView({ classes, students, curriculum, attendanceSessions, assessments, teacher, school }) {
            const [activeSubTab, setActiveSubTab] = useState("attendance");
            const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || "");

            useEffect(() => {
                if (classes.length > 0 && !selectedClassId) setSelectedClassId(classes[0].id);
            }, [classes]);

            const currentStudents = students.filter(s => (s.class_id || s.classId) === selectedClassId);
            const currentClass = classes.find(c => c.id === selectedClassId);
            const allTps = [];
            curriculum.forEach(cp => cp.materials.forEach(m => m.tps.forEach(tp => allTps.push(tp))));

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border shadow-sm space-y-4 no-print">
                        <div className="flex justify-between items-center">
                            <h3 className="text-base font-bold">Pusat Laporan Resmi SIPAKATAU</h3>
                            <button onClick={() => window.print()} className="bg-brand-600 text-white font-bold text-xs px-4 py-2 rounded-xl"><i className="fa-solid fa-print mr-1"></i> Cetak PDF</button>
                        </div>
                        <div className="flex border-b text-xs font-bold gap-4">
                            <button onClick={() => setActiveSubTab("attendance")} className={`pb-2 ${activeSubTab === 'attendance' ? 'text-brand-600 border-b-2 border-brand-600' : 'text-slate-500'}`}>1. Kehadiran</button>
                            <button onClick={() => setActiveSubTab("classScores")} className={`pb-2 ${activeSubTab === 'classScores' ? 'text-brand-600 border-b-2 border-brand-600' : 'text-slate-500'}`}>2. Nilai Kelas</button>
                        </div>
                        <div>
                            <label className="text-[11px] font-bold block mb-1">Kelas</label>
                            <select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full md:w-1/3 px-3 py-1.5 border rounded-xl text-xs">
                                {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="bg-white p-8 rounded-2xl border shadow-md space-y-6 max-w-4xl mx-auto">
                        <div className="flex items-center gap-4 border-b-2 border-slate-800 pb-4">
                            {school.logoUrl ? <img src={school.logoUrl} className="w-16 h-16 object-contain" /> : <div className="w-16 h-16 bg-slate-100 border rounded-xl flex items-center justify-center text-xs">Logo</div>}
                            <div className="flex-1 text-center">
                                <h4 className="font-extrabold text-sm uppercase">{school.agency || "DINAS PENDIDIKAN KABUPATEN GOWA"}</h4>
                                <h3 className="font-black text-base uppercase">{school.name}</h3>
                                <p className="text-[11px] text-slate-600">{school.address}</p>
                            </div>
                        </div>

                        {activeSubTab === "attendance" && (
                            <div className="space-y-4">
                                <h3 className="font-bold text-sm text-center uppercase">REKAP KEHADIRAN KELAS {currentClass?.name}</h3>
                                <table className="w-full text-left text-xs border-collapse">
                                    <thead className="bg-slate-100 font-bold border">
                                        <tr><th className="p-2 border">No</th><th className="p-2 border">Nama</th><th className="p-2 border">NIS</th><th className="p-2 border text-center">Hadir</th><th className="p-2 border text-center">Izin</th><th className="p-2 border text-center">Sakit</th><th className="p-2 border text-center">Alpa</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {currentStudents.map((st, i) => {
                                            const sessions = attendanceSessions.filter(a => (a.class_id || a.classId) === selectedClassId);
                                            let h=0, iz=0, s=0, a=0;
                                            sessions.forEach(sess => {
                                                const stt = sess.records?.[st.id] || "Hadir";
                                                if (stt === "Hadir") h++; else if (stt === "Izin") iz++; else if (stt === "Sakit") s++; else if (stt === "Alpa") a++;
                                            });
                                            return (
                                                <tr key={st.id}>
                                                    <td className="p-2 border">{i + 1}</td>
                                                    <td className="p-2 border font-bold">{st.name}</td>
                                                    <td className="p-2 border font-mono">{st.nis}</td>
                                                    <td className="p-2 border text-center text-emerald-700 font-bold">{h}</td>
                                                    <td className="p-2 border text-center text-blue-700">{iz}</td>
                                                    <td className="p-2 border text-center text-amber-700">{s}</td>
                                                    <td className="p-2 border text-center text-rose-700">{a}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeSubTab === "classScores" && (
                            <div className="space-y-4">
                                <h3 className="font-bold text-sm text-center uppercase">REKAP NILAI TAKSONOMI SOLO - {currentClass?.name}</h3>
                                <table className="w-full text-left text-xs border-collapse">
                                    <thead className="bg-slate-100 font-bold border">
                                        <tr><th className="p-2 border">No</th><th className="p-2 border">Nama</th><th className="p-2 border">NIS</th><th className="p-2 border text-center">Rata-rata SOLO</th><th className="p-2 border text-center">Nilai Angka</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {currentStudents.map((st, i) => {
                                            const tp = allTps[0];
                                            const studentScores = assessments[`${selectedClassId}_${tp?.id}`]?.[st.id] || {};
                                            const calc = tp ? calculateSoloScore(studentScores, tp) : null;
                                            return (
                                                <tr key={st.id}>
                                                    <td className="p-2 border">{i + 1}</td>
                                                    <td className="p-2 border font-bold">{st.name}</td>
                                                    <td className="p-2 border font-mono">{st.nis}</td>
                                                    <td className="p-2 border text-center font-bold">{calc?.isComplete ? calc.avgSolo : '-'}</td>
                                                    <td className="p-2 border text-center font-bold text-brand-700">{calc?.isComplete ? calc.numericScore : '-'}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        <div className="pt-8 grid grid-cols-2 text-center text-xs gap-8 border-t mt-8">
                            <div><p>Kepala Sekolah</p><div className="h-16"></div><p className="font-bold underline">{school.principalName}</p></div>
                            <div><p>Guru Mapel</p><div className="h-16"></div><p className="font-bold underline">{teacher.name}</p></div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ENTRY POINT ---
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [teacher, setTeacher] = useState(DEFAULT_TEACHER);
            const [school, setSchool] = useState(DEFAULT_SCHOOL);
            const [classes, setClasses] = useState(INITIAL_CLASSES);
            const [students, setStudents] = useState(INITIAL_STUDENTS);
            const [curriculum, setCurriculum] = useState(INITIAL_CURRICULUM);
            const [attendanceSessions, setAttendanceSessions] = useState([]);
            const [assessments, setAssessments] = useState({});
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = "success") => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const refreshData = async () => {
                if (!supabase) return;
                const { data: classData } = await supabase.from('classes').select('*');
                if (classData && classData.length > 0) setClasses(classData);

                const { data: studentData } = await supabase.from('students').select('*');
                if (studentData) setStudents(studentData);

                const { data: attData } = await supabase.from('attendance_sessions').select('*');
                if (attData) setAttendanceSessions(attData);

                const { data: assData } = await supabase.from('assessments').select('*');
                if (assData) {
                    const mappedAss = {};
                    assData.forEach(row => {
                        const key = `${row.class_id}_${row.tp_id}`;
                        if (!mappedAss[key]) mappedAss[key] = {};
                        mappedAss[key][row.student_id] = row.scores;
                    });
                    setAssessments(mappedAss);
                }
            };

            useEffect(() => {
                refreshData();
            }, []);

            return (
                <div className="flex min-h-screen">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-xs font-bold text-white flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                            <i className="fa-solid fa-circle-check"></i> {toast.msg}
                        </div>
                    )}

                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 no-print shrink-0 hidden md:flex">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-2">
                                <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-black text-lg shadow-md">S</div>
                                <div><h1 className="font-black text-base text-white tracking-wider">SIPAKATAU</h1><p className="text-[10px] text-brand-300 font-semibold">Cloud Database</p></div>
                            </div>
                            <nav className="space-y-1">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                                    { id: 'identity', label: 'Identitas Guru & Sekolah', icon: 'fa-id-card' },
                                    { id: 'classes', label: 'Data Kelas', icon: 'fa-chalkboard' },
                                    { id: 'students', label: 'Data Murid', icon: 'fa-user-graduate' },
                                    { id: 'attendance', label: 'Kehadiran Murid', icon: 'fa-calendar-check' },
                                    { id: 'curriculum', label: 'Kurikulum & Rubrik SOLO', icon: 'fa-book-open-reader' },
                                    { id: 'assessmentInput', label: 'Input Penilaian SOLO', icon: 'fa-pen-to-square' },
                                    { id: 'reports', label: 'Laporan Resmi', icon: 'fa-file-signature' },
                                ].map(item => (
                                    <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === item.id ? 'bg-brand-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400'}`}>
                                        <i className={`fa-solid ${item.icon} text-sm w-5`}></i>{item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                        <div className="border-t border-slate-800 pt-4 px-2 text-[11px] text-slate-500">
                            <p className="font-bold text-slate-400">SIPAKATAU v2.0</p>
                            <p>Pengembang: <strong>Hasdinar, S.Pd.</strong></p>
                        </div>
                    </aside>

                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {activeTab === 'dashboard' && <DashboardView classes={classes} students={students} curriculum={curriculum} attendance={attendanceSessions} assessments={assessments} teacher={teacher} school={school} setActiveTab={setActiveTab} />}
                        {activeTab === 'identity' && <IdentityView teacher={teacher} setTeacher={setTeacher} school={school} setSchool={setSchool} showToast={showToast} />}
                        {activeTab === 'classes' && <ClassesView classes={classes} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'students' && <StudentsView students={students} classes={classes} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'attendance' && <AttendanceView classes={classes} students={students} attendanceSessions={attendanceSessions} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'curriculum' && <CurriculumView curriculum={curriculum} setCurriculum={setCurriculum} showToast={showToast} />}
                        {activeTab === 'assessmentInput' && <AssessmentInputView classes={classes} students={students} curriculum={curriculum} assessments={assessments} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'reports' && <ReportsView classes={classes} students={students} curriculum={curriculum} attendanceSessions={attendanceSessions} assessments={assessments} teacher={teacher} school={school} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
