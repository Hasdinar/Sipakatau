        function calculateSoloScore(scores, tp) {
            if (!scores || Object.keys(scores).length === 0) return null;
            const iktpList = tp.iktps || [];
            if (iktpList.length === 0) return null;

            let totalSolo = 0;
            let assessedCount = 0;

            iktpList.forEach(ik => {
                if (scores[ik.id]) {
                    totalSolo += Number(scores[ik.id]);
                    assessedCount++;
                }
            });

            if (assessedCount < iktpList.length) {
                return { isComplete: false, assessedCount, totalCount: iktpList.length };
            }

            const avgSolo = +(totalSolo / iktpList.length).toFixed(2);
            
            let levelBase = "Prestructural";
            let skorBase = 1;
            let minVal = 0;
            let interval = 10;

            const ranges = tp.ranges || {
                Prestructural: { min: 0, max: 59 },
                Unistructural: { min: 60, max: 74 },
                Multistructural: { min: 75, max: 83 },
                Relational: { min: 84, max: 92 },
                ExtendedAbstract: { min: 93, max: 100 }
            };

            if (avgSolo >= 4.51) {
                levelBase = "ExtendedAbstract"; skorBase = 5; minVal = ranges.ExtendedAbstract.min; interval = ranges.ExtendedAbstract.max - ranges.ExtendedAbstract.min;
            } else if (avgSolo >= 3.5) {
                levelBase = "Relational"; skorBase = 4; minVal = ranges.Relational.min; interval = ranges.Relational.max - ranges.Relational.min;
            } else if (avgSolo >= 2.5) {
                levelBase = "Multistructural"; skorBase = 3; minVal = ranges.Multistructural.min; interval = ranges.Multistructural.max - ranges.Multistructural.min;
            } else if (avgSolo >= 1.5) {
                levelBase = "Unistructural"; skorBase = 2; minVal = ranges.Unistructural.min; interval = ranges.Unistructural.max - ranges.Unistructural.min;
            } else {
                levelBase = "Prestructural"; skorBase = 1; minVal = ranges.Prestructural.min; interval = ranges.Prestructural.max - ranges.Prestructural.min;
            }

            let numericScore = minVal + (avgSolo - skorBase) * interval;
            numericScore = +Math.min(100, Math.max(0, numericScore)).toFixed(2);

            const levelWeights = { Prestructural: 1, Unistructural: 2, Multistructural: 3, Relational: 4, ExtendedAbstract: 5 };
            const kktpTarget = tp.kktpLevel || "Multistructural";
            const isPassing = levelWeights[levelBase] >= levelWeights[kktpTarget];

            return { isComplete: true, avgSolo, levelBase, numericScore, isPassing, kktpTarget };
        }

                        if (stt === "Hadir") h++;

                        else if (stt === "Sakit") s++;
                        else if (stt === "Alpa") a++;
                        else if (stt === "Terlambat") t++;

                const totalRecords = h + iz + s + a + t;
                const attendancePct = totalRecords > 0 ? +(((h + t) / totalRecords) * 100).toFixed(1) : 0;

                                totalStudentsWithScore.add(st.id);
                                soloDist[calc.levelBase] = (soloDist[calc.levelBase] || 0) + 1;
                                totalEvaluated++;
                                if (calc.isPassing) totalPassed++;
                            }
                        }

        // --- STUDENTS VIEW ---
        function StudentsView({ students, setStudents, classes, showToast }) {
            const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || "");
            const [name, setName] = useState("");
            const [nis, setNis] = useState("");
            const [nisn, setNisn] = useState("");
            const [gender, setGender] = useState("L");

            // Import Excel States
            const [isImportModalOpen, setIsImportModalOpen] = useState(false);
            const [importFile, setImportFile] = useState(null);
            const [importTargetClassId, setImportTargetClassId] = useState(classes[0]?.id || "");
            const [parsedRows, setParsedRows] = useState([]);
            const [validationResult, setValidationResult] = useState({ valid: [], invalid: [] });

            const handleAdd = (e) => {
                e.preventDefault();
                if (!name || !nis) return alert("Nama dan NIS wajib diisi!");
                const isDuplicate = students.some(s => s.classId === selectedClassId && s.nis === nis);
                if (isDuplicate) return alert(`NIS ${nis} sudah terdaftar di kelas ini!`);

                setStudents([...students, { id: 's_' + Date.now(), classId: selectedClassId, name, nis, nisn, gender }]);
                setName(""); setNis(""); setNisn("");
                showToast("Murid berhasil ditambahkan!");
            };

            const downloadTemplate = () => {
                const templateData = [
                    ["No", "Nama Lengkap", "NIS", "NISN", "Jenis Kelamin", "Kelas", "Tempat Lahir", "Tanggal Lahir", "Alamat"],
                    [1, "Andi Ahmad Rivaldi", "24001", "0081234561", "L", classes[0]?.name || "VII A", "Sungguminasa", "2011-05-12", "Jl. Tumanurung No. 5"],
                    [2, "Nur Aisyah Humaira", "24002", "0081234562", "P", classes[0]?.name || "VII A", "Gowa", "2011-08-20", "Jl. Poros Malino Km. 4"]
                ];
                const ws = XLSX.utils.aoa_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template_Murid");
                XLSX.writeFile(wb, "Template_Import_Murid_SIPAKATAU.xlsx");
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setImportFile(file);

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                        if (data.length <= 1) {
                            alert("File Excel kosong atau tidak memiliki baris data!");
                            return;
                        }

                        // Parse headers and rows
                        const rows = data.slice(1);
                        const validList = [];
                        const invalidList = [];

                        // Existing NIS list for collision detection
                        const existingNisSet = new Set(students.filter(s => s.classId === (importTargetClassId || selectedClassId)).map(s => String(s.nis).trim()));
                        const batchNisSet = new Set();

                        rows.forEach((row, idx) => {
                            const rowNo = idx + 2; // header is row 1
                            if (!row || row.length === 0 || row.every(cell => cell === null || cell === undefined || String(cell).trim() === "")) {
                                return; // Abaikan baris kosong
                            }

                            const rowName = row[1] ? String(row[1]).trim() : "";
                            const rowNis = row[2] ? String(row[2]).trim() : "";
                            const rowNisn = row[3] ? String(row[3]).trim() : "";
                            const rowGender = row[4] ? String(row[4]).trim().toUpperCase() : "L";
                            const rowClassName = row[5] ? String(row[5]).trim() : "";
                            const rowBirthPlace = row[6] ? String(row[6]).trim() : "";
                            const rowBirthDate = row[7] ? String(row[7]).trim() : "";
                            const rowAddress = row[8] ? String(row[8]).trim() : "";

                            const errors = [];
                            if (!rowName) errors.push("Nama Lengkap wajib diisi");
                            if (!rowNis) errors.push("NIS wajib diisi");

                            // Match Class
                            let matchedClass = classes.find(c => c.name.toLowerCase() === rowClassName.toLowerCase());
                            if (!matchedClass && importTargetClassId) {
                                matchedClass = classes.find(c => c.id === importTargetClassId);
                            }

                            if (!matchedClass) {
                                errors.push(`Kelas "${rowClassName}" tidak ditemukan dalam sistem`);
                            }

                            const currentClassId = matchedClass ? matchedClass.id : importTargetClassId;

                            // Duplicate NIS Check
                            if (rowNis) {
                                if (existingNisSet.has(rowNis)) {
                                    errors.push(`NIS ${rowNis} sudah terdaftar di database kelas ini`);
                                } else if (batchNisSet.has(rowNis)) {
                                    errors.push(`NIS ${rowNis} duplikat dalam file Excel`);
                                } else {
                                    batchNisSet.add(rowNis);
                                }
                            }

                            if (errors.length > 0) {
                                invalidList.push({ rowNo, name: rowName || '-', nis: rowNis || '-', errors });
                            } else {
                                validList.push({
                                    id: 's_' + Date.now() + '_' + idx,
                                    classId: currentClassId,
                                    name: rowName,
                                    nis: rowNis,
                                    nisn: rowNisn,
                                    gender: (rowGender === 'P' || rowGender === 'PEREMPUAN') ? 'P' : 'L',
                                    birthPlace: rowBirthPlace,
                                    birthDate: rowBirthDate,
                                    address: rowAddress
                                });
                            }
                        });

                        setParsedRows(data);

        // --- CURRICULUM VIEW (COMPLETE INTERACTIVE CRUD & SOLO RUBRIC) ---
        function CurriculumView({ curriculum, setCurriculum, showToast }) {
            const [expandedCp, setExpandedCp] = useState({});
            const [expandedMat, setExpandedMat] = useState({});
            const [expandedTp, setExpandedTp] = useState({});

            // Modals & Active Edit State
            const [activeModal, setActiveModal] = useState(null); // 'cp', 'material', 'tp', 'iktp', 'kktp'
            const [modalData, setModalData] = useState({});

            const toggleCp = id => setExpandedCp(prev => ({ ...prev, [id]: !prev[id] }));
            const toggleMat = id => setExpandedMat(prev => ({ ...prev, [id]: !prev[id] }));
            const toggleTp = id => setExpandedTp(prev => ({ ...prev, [id]: !prev[id] }));

            // CRUD HANDLERS FOR CP
            const handleSaveCp = (e) => {
                e.preventDefault();
                if (modalData.id) {
                    setCurriculum(prev => prev.map(c => c.id === modalData.id ? { ...c, ...modalData } : c));
                    showToast("Capaian Pembelajaran berhasil diperbarui!");
                } else {
                    const newCp = {
                        id: 'cp_' + Date.now(),
                        subject: modalData.subject || "Ilmu Pengetahuan Alam (IPA)",
                        phase: modalData.phase || "D",
                        element: modalData.element || "Pemahaman IPA",
                        description: modalData.description || "",
                        materials: []
                    };
                    setCurriculum(prev => [...prev, newCp]);
                    showToast("Capaian Pembelajaran baru ditambahkan!");
                }
                setActiveModal(null);
            };

            const handleDeleteCp = (cpId) => {
                if (confirm("Apakah Anda yakin ingin menghapus CP ini beserta seluruh Materi, TP, IKTP, dan Rubrik di bawahnya?")) {
                    setCurriculum(prev => prev.filter(c => c.id !== cpId));
                    showToast("CP berhasil dihapus.", "error");
                }
            };

            // CRUD HANDLERS FOR MATERIAL
            const handleSaveMaterial = (e) => {
                e.preventDefault();
                const { cpId, id, title } = modalData;
                setCurriculum(prev => prev.map(cp => {
                    if (cp.id !== cpId) return cp;
                    let updatedMats = [...cp.materials];
                    if (id) {
                        updatedMats = updatedMats.map(m => m.id === id ? { ...m, title } : m);
                    } else {
                        updatedMats.push({ id: 'm_' + Date.now(), title, tps: [] });
                    }
                    return { ...cp, materials: updatedMats };
                }));
                showToast("Materi pembelajaran berhasil disimpan!");
                setActiveModal(null);
            };

            const handleDeleteMaterial = (cpId, matId) => {
                if (confirm("Hapus materi ini beserta TP dan IKTP di dalamnya?")) {
                    setCurriculum(prev => prev.map(cp => {
                        if (cp.id !== cpId) return cp;
                        return { ...cp, materials: cp.materials.filter(m => m.id !== matId) };
                    }));
                    showToast("Materi berhasil dihapus.", "error");
                }
            };

            // CRUD HANDLERS FOR TP
            const handleSaveTp = (e) => {
                e.preventDefault();
                const { cpId, matId, id, code, description } = modalData;
                setCurriculum(prev => prev.map(cp => {
                    if (cp.id !== cpId) return cp;
                    const updatedMats = cp.materials.map(m => {
                        if (m.id !== matId) return m;
                        let updatedTps = [...m.tps];
                        if (id) {
                            updatedTps = updatedTps.map(t => t.id === id ? { ...t, code, description } : t);
                        } else {
                            updatedTps.push({
                                id: 'tp_' + Date.now(),
                                code: code || `TP ${updatedTps.length + 1}`,
                                description,
                                kktpLevel: "Multistructural",
                                ranges: {
                                    Prestructural: { min: 0, max: 59 },
                                    Unistructural: { min: 60, max: 74 },
                                    Multistructural: { min: 75, max: 83 },
                                    Relational: { min: 84, max: 92 },
                                    ExtendedAbstract: { min: 93, max: 100 }
                                },
                                iktps: []
                            });
                        }
                        return { ...m, tps: updatedTps };
                    });
                    return { ...cp, materials: updatedMats };
                }));
                showToast("Tujuan Pembelajaran berhasil disimpan!");
                setActiveModal(null);
            };

            const handleDeleteTp = (cpId, matId, tpId) => {
                if (confirm("Hapus TP ini beserta seluruh IKTP dan rubrik di dalamnya?")) {
                    setCurriculum(prev => prev.map(cp => {
                        if (cp.id !== cpId) return cp;
                        const updatedMats = cp.materials.map(m => {
                            if (m.id !== matId) return m;
                            return { ...m, tps: m.tps.filter(t => t.id !== tpId) };
                        });
                        return { ...cp, materials: updatedMats };
                    }));
                    showToast("TP berhasil dihapus.", "error");
                }
            };

            // CRUD & AI FOR IKTP & RUBRIC
            const handleSaveIktp = (e) => {
                e.preventDefault();
                const { cpId, matId, tpId, id, description, rubric } = modalData;
                setCurriculum(prev => prev.map(cp => {
                    if (cp.id !== cpId) return cp;
                    const updatedMats = cp.materials.map(m => {
                        if (m.id !== matId) return m;
                        const updatedTps = m.tps.map(t => {
                            if (t.id !== tpId) return t;
                            let updatedIktps = [...t.iktps];
                            if (id) {
                                updatedIktps = updatedIktps.map(ik => ik.id === id ? { ...ik, description, rubric } : ik);
                            } else {
                                updatedIktps.push({
                                    id: 'ik_' + Date.now(),
                                    description,
                                    rubric: rubric || {
                                        Prestructural: "Murid belum menunjukkan pemahaman yang relevan.",
                                        Unistructural: "Murid memahami satu aspek dasar.",
                                        Multistructural: "Murid memahami beberapa aspek terpisah.",
                                        Relational: "Murid mampu menghubungkan antar aspek secara rasional.",
                                        ExtendedAbstract: "Murid mampu melakukan abstraksi dan mengaplikasikan pada konteks baru."
                                    }
                                });
                            }
                            return { ...t, iktps: updatedIktps };
                        });
                        return { ...m, tps: updatedTps };
                    });
                    return { ...cp, materials: updatedMats };
                }));
                showToast("IKTP & Rubrik SOLO berhasil disimpan!");
                setActiveModal(null);
            };

            const handleDeleteIktp = (cpId, matId, tpId, iktpId) => {
                if (confirm("Hapus IKTP ini?")) {
                    setCurriculum(prev => prev.map(cp => {
                        if (cp.id !== cpId) return cp;
                        const updatedMats = cp.materials.map(m => {
                            if (m.id !== matId) return m;
                            const updatedTps = m.tps.map(t => {
                                if (t.id !== tpId) return t;
                                return { ...t, iktps: t.iktps.filter(ik => ik.id !== iktpId) };
                            });
                            return { ...m, tps: updatedTps };
                        });
                        return { ...cp, materials: updatedMats };
                    }));
                    showToast("IKTP dihapus.", "error");
                }
            };

            const handleGenerateIktpAi = (cpId, matId, tp) => {
                const generatedDescription = `Murid mampu menganalisis implikasi lanjutan dari ${tp.description.toLowerCase().replace('murid mampu ', '')}.`;

            return (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 no-print">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h3 className="text-base font-bold text-slate-800">Pusat Laporan Resmi SIPAKATAU</h3>
                                <p className="text-xs text-slate-500">Cetak dan unduh administrasi rekap kehadiran & penilaian resmi.</p>
                            </div>
                            <button onClick={handlePrint} className="bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md flex items-center gap-2">
                                <i className="fa-solid fa-print"></i> Cetak / Save PDF
                            </button>
                        </div>

                        {/* SUBMENU TABS */}
                        <div className="flex border-b text-xs font-bold gap-4">
                            <button onClick={() => setActiveSubTab("attendance")} className={`pb-2 ${activeSubTab === 'attendance' ? 'text-brand-600 border-b-2 border-brand-600' : 'text-slate-500'}`}>
                                1. Rekap Kehadiran
                            </button>
                            <button onClick={() => setActiveSubTab("classScores")} className={`pb-2 ${activeSubTab === 'classScores' ? 'text-brand-600 border-b-2 border-brand-600' : 'text-slate-500'}`}>
                                2. Laporan Nilai Kelas
                            </button>
                            <button onClick={() => setActiveSubTab("studentScores")} className={`pb-2 ${activeSubTab === 'studentScores' ? 'text-brand-600 border-b-2 border-brand-600' : 'text-slate-500'}`}>
                                3. Laporan Nilai Individu
                            </button>
                        </div>

                        {/* FILTERS */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                            <div>
                                <label className="block text-[11px] font-bold text-slate-600 mb-1">Kelas</label>
                                <select value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)} className="w-full px-3 py-1.5 border rounded-xl text-xs outline-none">
                                    {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>

                            {activeSubTab !== "attendance" && (
                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">Jenis Laporan Nilai</label>
                                    <select value={scoreType} onChange={e => setScoreType(e.target.value)} className="w-full px-3 py-1.5 border rounded-xl text-xs outline-none">
                                        <option value="process">Nilai Proses Pembelajaran (SOLO)</option>
                                        <option value="semester">Nilai Akhir Semester</option>
                                    </select>
                                </div>
                            )}

                            {activeSubTab === "studentScores" && (
                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">Pilih Murid</label>
                                    <select value={selectedStudentId} onChange={e => setSelectedStudentId(e.target.value)} className="w-full px-3 py-1.5 border rounded-xl text-xs outline-none">
                                        <option value="">-- Pilih Murid --</option>
                                        {currentStudents.map(s => <option key={s.id} value={s.id}>{s.name} ({s.nis})</option>)}
                                    </select>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* REPORT CANVAS (PRINT AREA) */}
                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-md space-y-6 max-w-4xl mx-auto">
                        {/* KOP LAPORAN RESMI */}
                        <div className="flex items-center gap-4 border-b-2 border-slate-800 pb-4">
                            {school.logoUrl ? (
                                <img src={school.logoUrl} className="w-16 h-16 object-contain" />
                            ) : (
                                <div className="w-16 h-16 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 font-bold text-xs border">Logo</div>
                            )}
                            <div className="flex-1 text-center">
                                <h4 className="font-extrabold text-sm uppercase text-slate-800">{school.agency || "DINAS PENDIDIKAN KABUPATEN GOWA"}</h4>
                                <h3 className="font-black text-base uppercase text-slate-900">{school.name}</h3>
                                <p className="text-[11px] text-slate-600">{school.address} - {school.district}, {school.regency}</p>
                            </div>
                        </div>

                        {/* LAPORAN REKAP KEHADIRAN */}
                        {activeSubTab === "attendance" && (
                            <div className="space-y-4">
                                <div className="text-center">
                                    <h3 className="font-bold text-sm uppercase text-slate-800">REKAP KEHADIRAN MURID</h3>
                                    <p className="text-xs text-slate-600">Kelas: {currentClass?.name} | Semester Ganjil 2024/2025</p>
                                </div>

                                <table className="w-full text-left text-xs border-collapse">
                                    <thead className="bg-slate-100 font-bold border text-slate-800">
                                        <tr>
                                            <th className="p-2 border">No</th>
                                            <th className="p-2 border">Nama Murid</th>
                                            <th className="p-2 border">NIS</th>
                                            <th className="p-2 border text-center">Hadir</th>
                                            <th className="p-2 border text-center">Izin</th>
                                            <th className="p-2 border text-center">Sakit</th>
                                            <th className="p-2 border text-center">Alpa</th>
                                            <th className="p-2 border text-center">Terlambat</th>
                                            <th className="p-2 border text-center">% Kehadiran</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {currentStudents.map((st, i) => {
                                            const sessions = attendanceSessions.filter(a => a.classId === selectedClassId);
                                            let h=0, iz=0, s=0, a=0, t=0;
                                            sessions.forEach(sess => {
                                                const stt = sess.records[st.id] || "Hadir";
                                                if (stt === "Hadir") h++;
                                                else if (stt === "Izin") iz++;
                                                else if (stt === "Sakit") s++;
                                                else if (stt === "Alpa") a++;
                                                else if (stt === "Terlambat") t++;
                                            });
                                            const total = sessions.length || 1;
                                            const pct = +(((h + t) / total) * 100).toFixed(1);
                                            return (
                                                <tr key={st.id}>
                                                    <td className="p-2 border font-semibold">{i + 1}</td>
                                                    <td className="p-2 border font-bold text-slate-800">{st.name}</td>
                                                    <td className="p-2 border font-mono">{st.nis}</td>
                                                    <td className="p-2 border text-center font-bold text-emerald-700">{h}</td>
                                                    <td className="p-2 border text-center text-blue-700">{iz}</td>
                                                    <td className="p-2 border text-center text-amber-700">{s}</td>
                                                    <td className="p-2 border text-center text-rose-700">{a}</td>
                                                    <td className="p-2 border text-center text-purple-700">{t}</td>
                                                    <td className="p-2 border text-center font-mono font-bold text-slate-800">{pct}%</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {/* LAPORAN NILAI KELAS */}
                        {activeSubTab === "classScores" && (
                            <div className="space-y-4">
                                <div className="text-center">
                                    <h3 className="font-bold text-sm uppercase text-slate-800">
                                        {scoreType === 'process' ? 'LAPORAN NILAI PROSES PEMBELAJARAN (TAKSONOMI SOLO)' : 'LAPORAN NILAI AKHIR SEMESTER'}
                                    </h3>
                                    <p className="text-xs text-slate-600">Kelas: {currentClass?.name} | Mata Pelajaran: {teacher.subject}</p>
                                </div>

                                {scoreType === 'process' ? (
                                    <table className="w-full text-left text-xs border-collapse">
                                        <thead className="bg-slate-100 font-bold border text-slate-800">
                                            <tr>
                                                <th className="p-2 border">No</th>
                                                <th className="p-2 border">Nama Murid</th>
                                                <th className="p-2 border">NIS</th>
                                                <th className="p-2 border text-center">Rata-rata SOLO</th>
                                                <th className="p-2 border text-center">Level Base</th>
                                                <th className="p-2 border text-center">Nilai Angka</th>
                                                <th className="p-2 border text-center">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {currentStudents.map((st, i) => {
                                                const tp = allTps[0];
                                                const studentScores = assessments[`${selectedClassId}_${tp?.id}`]?.[st.id] || {};
                                                const calc = tp ? calculateSoloScore(studentScores, tp) : null;
                                                return (
                                                    <tr key={st.id}>
                                                        <td className="p-2 border font-semibold">{i + 1}</td>
                                                        <td className="p-2 border font-bold text-slate-800">{st.name}</td>
                                                        <td className="p-2 border font-mono">{st.nis}</td>
                                                        <td className="p-2 border text-center font-mono font-bold">{calc?.isComplete ? calc.avgSolo : '-'}</td>
                                                        <td className="p-2 border text-center text-[11px] font-semibold">{calc?.isComplete ? calc.levelBase : '-'}</td>
                                                        <td className="p-2 border text-center font-mono font-bold text-brand-700">{calc?.isComplete ? calc.numericScore : '-'}</td>
                                                        <td className="p-2 border text-center font-bold">{calc?.isComplete ? (calc.isPassing ? 'Tercapai' : 'Belum') : '-'}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                ) : (
                                    <table className="w-full text-left text-xs border-collapse">
                                        <thead className="bg-slate-100 font-bold border text-slate-800">
                                            <tr>
                                                <th className="p-2 border">No</th>
                                                <th className="p-2 border">Nama Murid</th>
                                                <th className="p-2 border">NIS</th>
                                                <th className="p-2 border text-center">Nilai Akhir Semester</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {currentStudents.map((st, i) => {
                                                const scoreVal = semesterScores[`${selectedClassId}_${st.id}`] || "";
                                                return (
                                                    <tr key={st.id}>
                                                        <td className="p-2 border font-semibold">{i + 1}</td>
                                                        <td className="p-2 border font-bold text-slate-800">{st.name}</td>
                                                        <td className="p-2 border font-mono">{st.nis}</td>
                                                        <td className="p-2 border text-center">
                                                            <input 
                                                                type="number" 
                                                                value={scoreVal}
                                                                onChange={e => handleSemesterScoreChange(st.id, e.target.value)}
                                                                placeholder="Belum Diisi"
                                                                className="w-24 px-2 py-1 border rounded text-center text-xs font-bold outline-none no-print"
                                                            />
                                                            <span className="print-only font-bold text-sm">{scoreVal || 'Belum Diisi'}</span>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        )}

                        {/* LAPORAN NILAI INDIVIDU */}
                        {activeSubTab === "studentScores" && (
                            <div className="space-y-4">
                                {selectedStudentId ? (
                                    (() => {
                                        const st = students.find(s => s.id === selectedStudentId);
                                        const tp = allTps[0];
                                        const studentScores = assessments[`${selectedClassId}_${tp?.id}`]?.[st?.id] || {};
                                        const calc = tp ? calculateSoloScore(studentScores, tp) : null;

                                        return (
                                            <div className="space-y-4">
                                                <div className="border-b pb-3">
                                                    <h3 className="font-bold text-sm uppercase text-slate-800 text-center">LAPORAN CAPAIAN HASIL BELAJAR MURID</h3>
                                                    <div className="grid grid-cols-2 text-xs mt-3 gap-1">
                                                        <div><span className="font-bold">Nama Murid:</span> {st?.name}</div>
                                                        <div><span className="font-bold">Mata Pelajaran:</span> {teacher.subject}</div>
                                                        <div><span className="font-bold">NIS / NISN:</span> {st?.nis} / {st?.nisn || '-'}</div>
                                                        <div><span className="font-bold">Kelas:</span> {currentClass?.name}</div>
                                                    </div>
                                                </div>

                                                <div className="space-y-2">
                                                    <h4 className="font-bold text-xs text-slate-800">I. Hasil Penilaian Taksonomi SOLO</h4>
                                                    <div className="border p-3 rounded-xl bg-slate-50 text-xs space-y-1">
                                                        <p><strong>Tujuan Pembelajaran:</strong> {tp?.description}</p>
                                                        <p><strong>Rata-rata SOLO:</strong> <span className="font-bold text-brand-700">{calc?.isComplete ? calc.avgSolo : '-'}</span></p>
                                                        <p><strong>Level Kualitas Pemahaman:</strong> <span className="font-bold">{calc?.isComplete ? calc.levelBase : '-'}</span></p>
                                                        <p><strong>Nilai Angka Konversi:</strong> <span className="font-bold text-slate-800">{calc?.isComplete ? calc.numericScore : '-'}</span></p>
                                                        <p><strong>Status Ketuntasan (KKTP):</strong> <span className="font-bold">{calc?.isComplete ? (calc.isPassing ? 'Tercapai' : 'Belum') : '-'}</span></p>
                                                    </div>
                                                </div>

                                                <div className="space-y-2">
                                                    <h4 className="font-bold text-xs text-slate-800">II. Deskripsi Capaian & Rekomendasi (AI Assistant)</h4>
                                                    <div className="p-3 border rounded-xl bg-purple-50/40 text-xs space-y-2">
                                                        <p className="text-slate-700">
                                                            <strong>Deskripsi Capaian:</strong> Murid menunjukkan pemahaman kualitas <em>{calc?.levelBase || 'Multistructural'}</em> dalam mengidentifikasi komponen materi genetik serta dapat menghubungkan konsep persilangan.
                                                        </p>
                                                        <p className="text-slate-700">
                                                            <strong>Rekomendasi Tindak Lanjut:</strong> Diberikan pengayaan analisis studi kasus variasi genetik lanjutan pada lingkungan sekitar.
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()
                                ) : (
                                    <p className="text-center text-xs text-slate-400 italic py-6">Silakan pilih murid pada filter di atas untuk melihat laporan individu.</p>
                                )}
                            </div>
                        )}

                        {/* TANDA TANGAN */}
                        <div className="pt-8 grid grid-cols-2 text-center text-xs gap-8 border-t mt-8">
                            <div>
                                {school.principalName && (
                                    <>
                                        <p>Mengetahui,</p>
                                        <p className="font-bold">Kepala Sekolah</p>
                                        <div className="h-16"></div>
                                        <p className="font-bold underline">{school.principalName}</p>
                                        <p>NIP. {school.principalNip || '-'}</p>
                                    </>
                                )}
                            </div>
                            <div>
                                <p>Sungguminasa, {new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                                <p className="font-bold">Guru Mata Pelajaran</p>
                                <div className="h-16"></div>
                                <p className="font-bold underline">{teacher.name}</p>
                                <p>NIP. {teacher.nip || '-'}</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ENTRY POINT ---
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [teacher, setTeacher] = useState(DEFAULT_TEACHER);
            const [school, setSchool] = useState(DEFAULT_SCHOOL);
            const [classes, setClasses] = useState(INITIAL_CLASSES);
            const [students, setStudents] = useState(INITIAL_STUDENTS);
            const [curriculum, setCurriculum] = useState(INITIAL_CURRICULUM);
            const [attendanceSessions, setAttendanceSessions] = useState([]);
            const [assessments, setAssessments] = useState({});
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = "success") => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            return (
                <div className="flex min-h-screen">
                    {/* SIDEBAR NAVIGATION */}
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 no-print shrink-0 hidden md:flex">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-2">
                                <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-black text-lg shadow-md">
                                    S
                                </div>
                                <div>
                                    <h1 className="font-black text-base text-white tracking-wider">SIPAKATAU</h1>
                                    <p className="text-[10px] text-brand-300 font-semibold">Student Growth & Assessment</p>
                                </div>
                            </div>

                            <nav className="space-y-1">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                                    { id: 'identity', label: 'Identitas Guru & Sekolah', icon: 'fa-id-card' },
                                    { id: 'classes', label: 'Data Kelas', icon: 'fa-chalkboard' },
                                    { id: 'students', label: 'Data Murid', icon: 'fa-user-graduate' },
                                    { id: 'attendance', label: 'Kehadiran Murid', icon: 'fa-calendar-check' },
                                    { id: 'curriculum', label: 'Kurikulum & Rubrik SOLO', icon: 'fa-book-open-reader' },
                                    { id: 'assessmentInput', label: 'Input Penilaian SOLO', icon: 'fa-pen-to-square' },
                                    { id: 'reports', label: 'Laporan Resmi', icon: 'fa-file-signature' },
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}
                                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                                            activeTab === item.id ? 'bg-brand-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400'
                                        }`}
                                    >
                                        <i className={`fa-solid ${item.icon} text-sm w-5`}></i>
                                        {item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="border-t border-slate-800 pt-4 px-2 text-[11px] text-slate-500">
                            <p className="font-bold text-slate-400">SIPAKATAU v2.0</p>
                            <p>Pengembang: <strong>Hasdinar, S.Pd.</strong></p>
                            <p>Dinas Pendidikan Kab. Gowa</p>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {toast && (
                            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-xs font-bold text-white flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                                <i className="fa-solid fa-circle-check"></i> {toast.msg}
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <DashboardView 
                                classes={classes} students={students} curriculum={curriculum} 
                                attendance={attendanceSessions} assessments={assessments} 
                                teacher={teacher} school={school} setActiveTab={setActiveTab} 
                            />
                        )}
                        {activeTab === 'identity' && <IdentityView teacher={teacher} setTeacher={setTeacher} school={school} setSchool={setSchool} showToast={showToast} />}
                        {activeTab === 'classes' && <ClassesView classes={classes} setClasses={setClasses} showToast={showToast} />}
                        {activeTab === 'students' && <StudentsView students={students} setStudents={setStudents} classes={classes} showToast={showToast} />}
                        {activeTab === 'attendance' && <AttendanceView classes={classes} students={students} attendanceSessions={attendanceSessions} setAttendanceSessions={setAttendanceSessions} showToast={showToast} />}
                        {activeTab === 'curriculum' && <CurriculumView curriculum={curriculum} setCurriculum={setCurriculum} showToast={showToast} />}
                        {activeTab === 'assessmentInput' && <AssessmentInputView classes={classes} students={students} curriculum={curriculum} assessments={assessments} setAssessments={setAssessments} showToast={showToast} />}
                        {activeTab === 'reports' && <ReportsView classes={classes} students={students} curriculum={curriculum} attendanceSessions={attendanceSessions} assessments={assessments} teacher={teacher} school={school} />}
                    </main>
                </div>
            );
        }

        // RENDER REACT APP
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
