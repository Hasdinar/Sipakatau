        function calculateSoloScore(scores, tp) {
            if (!scores || Object.keys(scores).length === 0) return null;
            const iktpList = tp.iktps || [];
            if (iktpList.length === 0) return null;

            let totalSolo = 0;
            let assessedCount = 0;

            iktpList.forEach(ik => {
                if (scores[ik.id]) {
                    totalSolo += Number(scores[ik.id]);
                    assessedCount++;
                }
            });

            if (assessedCount < iktpList.length) {
                return { isComplete: false, assessedCount, totalCount: iktpList.length };
            }

            const avgSolo = +(totalSolo / iktpList.length).toFixed(2);
            
            let levelBase = "Prestructural";
            let skorBase = 1;
            let minVal = 0;
            let interval = 10;

            const ranges = tp.ranges || {
                Prestructural: { min: 0, max: 59 },
                Unistructural: { min: 60, max: 74 },
                Multistructural: { min: 75, max: 83 },
                Relational: { min: 84, max: 92 },
                ExtendedAbstract: { min: 93, max: 100 }
            };

            if (avgSolo >= 4.51) {
                levelBase = "ExtendedAbstract"; skorBase = 5; minVal = ranges.ExtendedAbstract.min; interval = ranges.ExtendedAbstract.max - ranges.ExtendedAbstract.min;
            } else if (avgSolo >= 3.5) {
                levelBase = "Relational"; skorBase = 4; minVal = ranges.Relational.min; interval = ranges.Relational.max - ranges.Relational.min;
            } else if (avgSolo >= 2.5) {
                levelBase = "Multistructural"; skorBase = 3; minVal = ranges.Multistructural.min; interval = ranges.Multistructural.max - ranges.Multistructural.min;
            } else if (avgSolo >= 1.5) {
                levelBase = "Unistructural"; skorBase = 2; minVal = ranges.Unistructural.min; interval = ranges.Unistructural.max - ranges.Unistructural.min;
            } else {
                levelBase = "Prestructural"; skorBase = 1; minVal = ranges.Prestructural.min; interval = ranges.Prestructural.max - ranges.Prestructural.min;
            }

            let numericScore = minVal + (avgSolo - skorBase) * interval;
            numericScore = +Math.min(100, Math.max(0, numericScore)).toFixed(2);

            const levelWeights = { Prestructural: 1, Unistructural: 2, Multistructural: 3, Relational: 4, ExtendedAbstract: 5 };
            const kktpTarget = tp.kktpLevel || "Multistructural";
            const isPassing = levelWeights[levelBase] >= levelWeights[kktpTarget];

            return { isComplete: true, avgSolo, levelBase, numericScore, isPassing, kktpTarget };
        }

                        else if (stt === "Sakit") s++;
                        else if (stt === "Alpa") a++;
                        else if (stt === "Terlambat") t++;

                const totalRecords = h + iz + s + a + t;

                return { h, iz, s, a, t, totalRecords, attendancePct };

                let totalStudentsWithScore = new Set();
                const soloDist = { Prestructural: 0, Unistructural: 0, Multistructural: 0, Relational: 0, ExtendedAbstract: 0 };

                let totalEvaluated = 0;

                    unassessedTpCount: Math.max(0, allTps.length - assessedTpCount),
                    completionPct,
                    studentsWithScoreCount: totalStudentsWithScore.size,

                    totalEvaluated,
                    passRatePct

        function ClassesView({ classes, showToast, refreshData }) {

            const handleAddClass = async (e) => {
                e.preventDefault();

                setLoading(true);

                if (supabase) {
                    const { error } = await supabase.from('classes').insert([{ name: className, grade, academic_year: "2024/2025", semester: "Ganjil" }]);

                    else refreshData();
                }

                    const { error } = await supabase.from('classes').delete().eq('id', id);

                showToast("Kelas dihapus.", "error");

        // --- MAIN APP ENTRY POINT ---
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [teacher, setTeacher] = useState(DEFAULT_TEACHER);
            const [school, setSchool] = useState(DEFAULT_SCHOOL);
            const [classes, setClasses] = useState([]);
            const [students, setStudents] = useState([]);
            const [curriculum, setCurriculum] = useState(INITIAL_CURRICULUM);
            const [attendanceSessions, setAttendanceSessions] = useState([]);
            const [assessments, setAssessments] = useState({});
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = "success") => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const refreshData = async () => {
                if (!supabase) return;
                const { data: classData } = await supabase.from('classes').select('*');
                if (classData && classData.length > 0) setClasses(classData);

                const { data: studentData } = await supabase.from('students').select('*');
                if (studentData) setStudents(studentData);

                const { data: attData } = await supabase.from('attendance_sessions').select('*');
                if (attData) setAttendanceSessions(attData);

                const { data: assData } = await supabase.from('assessments').select('*');
                if (assData) {
                    const mappedAss = {};
                    assData.forEach(row => {
                        const key = `${row.class_id}_${row.tp_id}`;
                        if (!mappedAss[key]) mappedAss[key] = {};
                        mappedAss[key][row.student_id] = row.scores;
                    });
                    setAssessments(mappedAss);
                }
            };

            useEffect(() => {
                refreshData();
            }, []);

            return (
                <div className="flex min-h-screen">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-xs font-bold text-white flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                            <i className="fa-solid fa-circle-check"></i> {toast.msg}
                        </div>
                    )}

                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4 no-print shrink-0 hidden md:flex">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-2">
                                <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-black text-lg shadow-md">S</div>
                                <div><h1 className="font-black text-base text-white tracking-wider">SIPAKATAU</h1><p className="text-[10px] text-brand-300 font-semibold">Cloud Database</p></div>
                            </div>
                            <nav className="space-y-1">
                                {[
                                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                                    { id: 'identity', label: 'Identitas Sekolah', icon: 'fa-id-card' },
                                    { id: 'classes', label: 'Data Kelas', icon: 'fa-chalkboard' },
                                    { id: 'students', label: 'Data Murid', icon: 'fa-user-graduate' },
                                    { id: 'attendance', label: 'Kehadiran Murid', icon: 'fa-calendar-check' },
                                    { id: 'curriculum', label: 'Kurikulum & SOLO', icon: 'fa-book-open-reader' },
                                    { id: 'assessmentInput', label: 'Input Penilaian SOLO', icon: 'fa-pen-to-square' },
                                    { id: 'reports', label: 'Laporan Resmi', icon: 'fa-file-signature' },
                                ].map(item => (
                                    <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${activeTab === item.id ? 'bg-brand-600 text-white shadow-md' : 'hover:bg-slate-800 text-slate-400'}`}>
                                        <i className={`fa-solid ${item.icon} text-sm w-5`}></i>{item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </aside>

                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {activeTab === 'dashboard' && <DashboardView classes={classes} students={students} curriculum={curriculum} attendance={attendanceSessions} assessments={assessments} teacher={teacher} school={school} setActiveTab={setActiveTab} />}
                        {activeTab === 'identity' && <IdentityView teacher={teacher} setTeacher={setTeacher} school={school} setSchool={setSchool} showToast={showToast} />}
                        {activeTab === 'classes' && <ClassesView classes={classes} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'students' && <StudentsView students={students} classes={classes} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'attendance' && <AttendanceView classes={classes} students={students} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'curriculum' && <CurriculumView curriculum={curriculum} setCurriculum={setCurriculum} showToast={showToast} />}
                        {activeTab === 'assessmentInput' && <AssessmentInputView classes={classes} students={students} curriculum={curriculum} assessments={assessments} showToast={showToast} refreshData={refreshData} />}
                        {activeTab === 'reports' && <ReportsView classes={classes} students={students} curriculum={curriculum} attendanceSessions={attendanceSessions} assessments={assessments} teacher={teacher} school={school} />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
